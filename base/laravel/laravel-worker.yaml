apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-worker
  labels:
    app: laravel-app
    role: worker
spec:
  selector:
    matchLabels:
      app: laravel-app
      role: worker

  template:
    metadata:
      labels:
        app: laravel-app
        role: worker

    spec:

      ########################################
      # 🔥 Shared volume to store Laravel code
      ########################################
      volumes:
        - name: app-code
          emptyDir: {}

      ########################################
      # 🔥 initContainer: copies Laravel code
      ########################################
      initContainers:
        - name: copy-app
          image: 902085629324.dkr.ecr.us-east-2.amazonaws.com/laravel-app-k8s:latest
          command:
            - sh
            - -c
            - |
              echo "Copying Laravel app..." ;
              cp -R /var/www/html/* /var/www/ ;
              cp -R /var/www/html/.[!.]* /var/www/ 2>/dev/null || true ;
              echo "Copy done."
          volumeMounts:
            - name: app-code
              mountPath: /var/www
          envFrom:
            - secretRef:
                name: laravel-env-secret

      ########################################
      # 🔥 Worker container
      ########################################
      containers:
        - name: worker
          image: 902085629324.dkr.ecr.us-east-2.amazonaws.com/laravel-app-k8s:latest
          imagePullPolicy: Always
          workingDir: /var/www
          command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --timeout=60
          volumeMounts:
            - name: app-code
              mountPath: /var/www
          envFrom:
            - secretRef:
                name: laravel-env-secret

      restartPolicy: Always
