apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-worker
  labels:
    app: laravel-app
    role: worker
spec:
  selector:
    matchLabels:
      app: laravel-app
      role: worker

  template:
    metadata:
      labels:
        app: laravel-app
        role: worker

    spec:
      volumes:
        - name: app-code
          emptyDir: {}

      initContainers:
        - name: copy-app
          image: 902085629324.dkr.ecr.us-east-2.amazonaws.com/laravel-app-k8s:20260129-210256-c8170e5
          command:
            - sh
            - -c
            - |
              echo "Copying Laravel app..."
              cp -R /var/www/* /var/www-out/ 2>/dev/null || true
              cp -R /var/www/.[!.]* /var/www-out/ 2>/dev/null || true
              echo "Copy done."
          volumeMounts:
            - name: app-code
              mountPath: /var/www-out
          envFrom:
            - secretRef:
                name: laravel-env-secret

      containers:
        - name: worker
          image: 902085629324.dkr.ecr.us-east-2.amazonaws.com/laravel-app-k8s:20260129-210256-c8170e5
          imagePullPolicy: Always
          workingDir: /var/www
          command:
            - php
            - /var/www/artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --timeout=60
          volumeMounts:
            - name: app-code
              mountPath: /var/www
          envFrom:
            - secretRef:
                name: laravel-env-secret

      restartPolicy: Always
