apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  labels:
    app: laravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: laravel-nginx-config

        # 🔥 هذا هو المهم — مجلد مشترك بين nginx و php-fpm
        - name: app-code
          emptyDir: {}

      containers:
        # --------------------
        # PHP-FPM / Laravel
        # --------------------
        - name: laravel
          image: 902085629324.dkr.ecr.us-east-2.amazonaws.com/laravel-app-k8s:latest
          imagePullPolicy: Always

          envFrom:
            - secretRef:
                name: laravel-env-secret

          command: ["php-fpm", "-F"]

          volumeMounts:
            - name: app-code
              mountPath: /var/www    # ← هنا يتم وضع كود Laravel

          ports:
            - containerPort: 9000

          # Probes (نفس التي كتبتها أنت)
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5

        # --------------------
        # NGINX
        # --------------------
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d

            # 🔥 يجب أن يرى نفس كود Laravel
            - name: app-code
              mountPath: /var/www

          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
          startupProbe:
            httpGet:
              path: /health/startup
              port: 80
